name: Bug report
description: Report a reproducible problem without exposing private captures or profile data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Read the troubleshooting guide first. Review and redact any attachment.
        Never upload credentials, a whole profile, settings.json, private originals, or library backups.
        Suspected vulnerabilities belong in private reporting, not this form.
  - type: input
    id: version
    attributes:
      label: Hotshot version
      placeholder: "Version shown in About Hotshot"
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options: [Core, Full, Development build, Unsure]
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options: [x64, ARM64, Unsure]
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      placeholder: "Windows 11, build ... (no device name or serial)"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a generated/non-sensitive example where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and visible error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant display, audio, or integration details
      description: "Only relevant facts: scaling/HDR, microphone selection, MCP client, or sync mode. Redact names and paths."
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed attachments/excerpts and removed private content, credentials, and identifying paths.
          required: true
