name: Release Please and publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Existing tagged version to package (bootstrap or repair)
        required: true
        type: string

concurrency:
  group: hotshot-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.please.outputs.release_created || github.event_name == 'workflow_dispatch' }}
      version: ${{ steps.please.outputs.version || inputs.version }}
      tag: ${{ steps.please.outputs.tag_name || format('v{0}', inputs.version) }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: please
        if: github.event_name == 'push'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            runner: windows-latest
          - runtime: win-arm64
            runner: windows-11-arm
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate release version
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw 'Invalid release version.'
          }
          if ((Get-Content version.txt -Raw).Trim() -ne $env:RELEASE_VERSION) {
            throw 'Tag version does not match version.txt.'
          }
      - name: Restore pinned packaging tool
        run: dotnet tool restore
      - name: Download previous release for deltas
        shell: pwsh
        run: |
          $previous = gh release list --repo "$env:GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect previous releases.' }
          if ($previous.Count -gt 0 -and $previous[0].tagName -ne $env:RELEASE_TAG) {
            $assets = @(gh release view $previous[0].tagName --repo "$env:GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            if ($LASTEXITCODE -ne 0) { throw 'Could not inspect previous release assets.' }
            foreach ($channel in '${{ matrix.runtime }}', 'core-${{ matrix.runtime }}') {
              if ($assets -contains "releases.$channel.json") {
                dotnet tool run vpk -- download github --repoUrl "https://github.com/$env:GITHUB_REPOSITORY" --token $env:GH_TOKEN --channel $channel --outputDir "artifacts\releases\$channel"
                if ($LASTEXITCODE -ne 0) { throw "Previous $channel update feed could not be downloaded." }
              } else {
                Write-Host "No previous $channel feed: creating its first public release."
              }
            }
          }
      - name: Tests
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: |
          foreach ($project in 'Core', 'Capture', 'Editor', 'Gif') {
            dotnet test --project "tests\Hotshot.$project.Tests\Hotshot.$project.Tests.csproj" --output Detailed
            if ($LASTEXITCODE -ne 0) { throw "$project tests failed." }
          }
      - name: Package both public editions and the optional component
        shell: pwsh
        run: |
          foreach ($edition in 'Full', 'Core') {
            .\build\package.ps1 -Version $env:RELEASE_VERSION -Runtime '${{ matrix.runtime }}' -Edition $edition
          }
      - name: Validate packaged Full/Core MCP and optional component startup
        shell: pwsh
        run: |
          .\tests\Hotshot.Agents.Manifests.ps1
          foreach ($channel in '${{ matrix.runtime }}', 'core-${{ matrix.runtime }}') {
            $publish = "artifacts\publish\$env:RELEASE_VERSION\$channel"
            dotnet run --project tests\Hotshot.Mcp.Harness\Hotshot.Mcp.Harness.csproj -c Release -r '${{ matrix.runtime }}' -- "$publish\Mcp\Hotshot.Mcp.exe"
            if ($LASTEXITCODE -ne 0) { throw "Packaged $channel MCP protocol contract failed." }
            dotnet run --project tests\Hotshot.Components.Harness\Hotshot.Components.Harness.csproj -c Release -r '${{ matrix.runtime }}' -- "$publish" "artifacts\releases\${{ matrix.runtime }}\Hotshot-Copilot-${env:RELEASE_VERSION}-${{ matrix.runtime }}.json"
            if ($LASTEXITCODE -ne 0) { throw "Packaged $channel distribution/component startup failed." }
          }
      - name: Stage a flat, collision-free public asset set
        shell: pwsh
        run: |
          $stage = "artifacts\release-assets\${{ matrix.runtime }}"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          foreach ($channel in '${{ matrix.runtime }}', 'core-${{ matrix.runtime }}') {
            foreach ($file in Get-ChildItem -LiteralPath "artifacts\releases\$channel" -File) {
              $target = Join-Path $stage $file.Name
              if (Test-Path -LiteralPath $target) { throw "Release asset collision: $($file.Name)" }
              Copy-Item -LiteralPath $file.FullName -Destination $target
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runtime }}
          path: artifacts/release-assets/${{ matrix.runtime }}/*
          if-no-files-found: error

  publish:
    needs: [release, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish complete release atomically
        shell: bash
        run: |
          set -euo pipefail
          for runtime in win-x64 win-arm64; do
            for edition in "" "Core-"; do
              for suffix in Setup.exe Portable.zip; do
                test -s "release-assets/Hotshot-${edition}${runtime}-${suffix}"
              done
            done
            for channel in "$runtime" "core-$runtime"; do
              test -s "release-assets/releases.${channel}.json"
              test -s "release-assets/assets.${channel}.json"
              test -s "release-assets/Hotshot-${RELEASE_VERSION}-${channel}-full.nupkg"
            done
            test -s "release-assets/Hotshot-Copilot-${RELEASE_VERSION}-${runtime}.zip"
            test -s "release-assets/Hotshot-Copilot-${RELEASE_VERSION}-${runtime}.json"
          done
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "Hotshot $RELEASE_VERSION"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
